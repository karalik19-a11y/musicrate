# Fly.io — `fly launch --copy-config --no-deploy && fly volumes create musicrate_data --size 1 && fly deploy`
app = "musicrate"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  # set the real code with: fly secrets set ARTIST_PASSWORD=...

[[mounts]]
  source = "musicrate_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep audio streaming instant
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

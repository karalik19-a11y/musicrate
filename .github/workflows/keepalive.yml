name: Keep-Alive Ping

on:
  schedule:
    # Ping every 10 minutes to prevent the free instance (e.g. Render) from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          TARGET_URL: ${{ vars.MUSICRATE_API_URL || 'https://musicrate.onrender.com' }}
        run: |
          URL="${TARGET_URL%/}/api/health"
          echo "Pinging $URL..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 20 "$URL" || echo "000")
          echo "HTTP response status: $HTTP_STATUS"
          if [ -f response.json ]; then
            cat response.json
            echo ""
          fi
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Ping successful!"
          else
            echo "::warning::Ping returned HTTP $HTTP_STATUS (service might be booting or temporarily unavailable)"
          fi
